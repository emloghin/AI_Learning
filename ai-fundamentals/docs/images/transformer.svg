<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 600" font-family="Inter,sans-serif" role="img" aria-label="A transformer block: token embeddings flow up through self-attention, add and norm, feed-forward, add and norm, repeated N times, then an output layer gives next-token probabilities">
  <defs>
    <marker id="tfArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="660" height="600" fill="#ffffff"/>

  <!-- Output layer -->
  <rect x="200" y="30" width="240" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="320" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Output layer + softmax</text>
  <text x="320" y="72" text-anchor="middle" font-size="12" fill="#5b21b6">probabilities for the next token</text>
  <text x="470" y="62" font-size="12" fill="#334155">e.g. "mat" 40%, "floor" 20% …</text>

  <!-- Repeated block outline -->
  <rect x="120" y="120" width="340" height="320" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="136" y="144" font-size="13" font-weight="700" fill="#334155">Transformer block  × N</text>
  <text x="136" y="162" font-size="11" fill="#64748b">(stacked many times)</text>

  <!-- Add & Norm 2 -->
  <rect x="200" y="176" width="240" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="199" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">Add &amp; Norm</text>

  <!-- Feed-forward -->
  <rect x="200" y="236" width="240" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="263" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Feed-forward network</text>
  <text x="470" y="256" font-size="12" fill="#334155">each token is processed</text>
  <text x="470" y="272" font-size="12" fill="#334155">on its own ("thinking")</text>

  <!-- Add & Norm 1 -->
  <rect x="200" y="304" width="240" height="36" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="327" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">Add &amp; Norm</text>
  <text x="470" y="320" font-size="12" fill="#334155">add the input back,</text>
  <text x="470" y="336" font-size="12" fill="#334155">then rescale the numbers</text>

  <!-- Attention -->
  <rect x="200" y="364" width="240" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Multi-head self-attention</text>
  <text x="320" y="403" text-anchor="middle" font-size="11" fill="#1e40af">tokens look at each other</text>
  <text x="470" y="384" font-size="12" fill="#334155">mixes in context from</text>
  <text x="470" y="400" font-size="12" fill="#334155">earlier tokens</text>

  <!-- Embeddings -->
  <rect x="200" y="466" width="240" height="44" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="320" y="486" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">Embeddings + position</text>
  <text x="320" y="502" text-anchor="middle" font-size="11" fill="#075985">each token becomes a list of numbers</text>

  <!-- Input tokens -->
  <rect x="200" y="540" width="240" height="40" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="320" y="566" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">"The" "cat" "sat" "on" "the"</text>
  <text x="470" y="566" font-size="12" fill="#334155">input tokens</text>

  <!-- Main upward flow -->
  <line x1="320" y1="540" x2="320" y2="512" stroke="#475569" stroke-width="2" marker-end="url(#tfArrow)"/>
  <line x1="320" y1="466" x2="320" y2="414" stroke="#475569" stroke-width="2" marker-end="url(#tfArrow)"/>
  <line x1="320" y1="364" x2="320" y2="342" stroke="#475569" stroke-width="2" marker-end="url(#tfArrow)"/>
  <line x1="320" y1="304" x2="320" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#tfArrow)"/>
  <line x1="320" y1="236" x2="320" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#tfArrow)"/>
  <line x1="320" y1="176" x2="320" y2="86" stroke="#475569" stroke-width="2" marker-end="url(#tfArrow)"/>

  <!-- Residual (skip) connections -->
  <path d="M320 440 H160 V322 H198" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tfArrow)"/>
  <path d="M320 292 H160 V194 H198" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tfArrow)"/>
  <text x="146" y="380" font-size="11" fill="#92400e" transform="rotate(-90 146 380)" text-anchor="middle">skip connection</text>
  <text x="146" y="243" font-size="11" fill="#92400e" transform="rotate(-90 146 243)" text-anchor="middle">skip connection</text>
</svg>
