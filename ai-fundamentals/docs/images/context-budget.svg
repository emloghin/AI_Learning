<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img" aria-label="A context window drawn as one long bar split into system prompt, tool definitions, conversation history, retrieved documents, user message, output reserve and free space">
  <rect x="0" y="0" width="800" height="430" fill="#FFFFFF"/>
  <text x="400" y="34" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="700" fill="#111827">One context window, many tenants</text>
  <text x="400" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#4B5563">Everything the model reads and writes in one request must fit inside the same token budget (sizes are illustrative)</text>

  <!-- Input / output brackets -->
  <path d="M40 92 L40 84 L580 84 L580 92" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="310" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#374151">Input tokens (what you send, every request)</text>
  <path d="M580 92 L580 84 L688 84 L688 92" fill="none" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="634" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#B91C1C">Output</text>

  <!-- Stacked bar -->
  <rect x="40" y="96" width="58" height="56" fill="#4F46E5"/>
  <rect x="98" y="96" width="86" height="56" fill="#7C3AED"/>
  <rect x="184" y="96" width="180" height="56" fill="#0EA5E9"/>
  <rect x="364" y="96" width="180" height="56" fill="#10B981"/>
  <rect x="544" y="96" width="36" height="56" fill="#F59E0B"/>
  <rect x="580" y="96" width="108" height="56" fill="#EF4444"/>
  <rect x="688" y="96" width="72" height="56" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="40" y="96" width="720" height="56" fill="none" stroke="#111827" stroke-width="2"/>

  <text x="69" y="129" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
  <text x="141" y="129" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
  <text x="274" y="129" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
  <text x="454" y="129" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
  <text x="562" y="129" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#111827">5</text>
  <text x="634" y="129" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">6</text>
  <text x="724" y="129" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#4B5563">free</text>

  <text x="40" y="172" font-family="Inter,sans-serif" font-size="12" fill="#6B7280">0 tokens</text>
  <text x="760" y="172" text-anchor="end" font-family="Inter,sans-serif" font-size="12" fill="#6B7280">context window limit</text>

  <!-- Legend, left column -->
  <rect x="40" y="200" width="18" height="18" fill="#4F46E5"/>
  <text x="68" y="214" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#111827">1  System prompt / instructions</text>
  <text x="68" y="232" font-family="Inter,sans-serif" font-size="12" fill="#4B5563">Stable. Put it first so prompt caching can reuse it.</text>

  <rect x="40" y="252" width="18" height="18" fill="#7C3AED"/>
  <text x="68" y="266" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#111827">2  Tool and MCP definitions</text>
  <text x="68" y="284" font-family="Inter,sans-serif" font-size="12" fill="#4B5563">Every enabled tool schema costs tokens on every call.</text>

  <rect x="40" y="304" width="18" height="18" fill="#0EA5E9"/>
  <text x="68" y="318" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#111827">3  Conversation history</text>
  <text x="68" y="336" font-family="Inter,sans-serif" font-size="12" fill="#4B5563">Grows each turn. Summarize, compact or start fresh.</text>

  <!-- Legend, right column -->
  <rect x="420" y="200" width="18" height="18" fill="#10B981"/>
  <text x="448" y="214" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#111827">4  Retrieved documents (RAG)</text>
  <text x="448" y="232" font-family="Inter,sans-serif" font-size="12" fill="#4B5563">Send the few best chunks, not whole files.</text>

  <rect x="420" y="252" width="18" height="18" fill="#F59E0B"/>
  <text x="448" y="266" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#111827">5  User message</text>
  <text x="448" y="284" font-family="Inter,sans-serif" font-size="12" fill="#4B5563">Often the smallest part of the request.</text>

  <rect x="420" y="304" width="18" height="18" fill="#EF4444"/>
  <text x="448" y="318" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#111827">6  Output reserve (incl. reasoning)</text>
  <text x="448" y="336" font-family="Inter,sans-serif" font-size="12" fill="#4B5563">Leave room, or the answer gets cut off.</text>

  <rect x="40" y="364" width="720" height="44" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="400" y="391" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#3730A3">Budget rule: blocks 1 to 5 plus block 6 must stay below the limit. Shrinking 2, 3 and 4 usually saves the most.</text>
</svg>
