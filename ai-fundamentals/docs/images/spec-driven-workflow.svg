<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="sdd-title sdd-desc">
  <title id="sdd-title">From a reviewed spec to a controlled release</title>
  <desc id="sdd-desc">A human approves the requirements. Spec Kit produces the spec, plan and tasks. One coding agent or an optional Squad team implements them. Tests, code review and operational checks provide evidence before a human release decision. Gaps feed back into the spec and tasks.</desc>
  <defs>
    <marker id="sdd-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="440" rx="16" fill="#f8fafc"/>
  <g font-family="Inter,sans-serif" text-anchor="middle">
    <text x="380" y="34" font-size="18" font-weight="700" fill="#0f172a">Intent first. Evidence before release.</text>
    <rect x="25" y="60" width="210" height="112" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="130" y="91" font-size="16" font-weight="700" fill="#1e3a8a">1. Human intent</text>
    <text x="130" y="119" font-size="13" fill="#1e3a8a">Users, rules, boundaries</text>
    <text x="130" y="144" font-size="13" fill="#1e3a8a">Approve the requirements</text>
    <rect x="275" y="60" width="210" height="112" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="380" y="91" font-size="16" font-weight="700" fill="#4c1d95">2. Spec Kit</text>
    <text x="380" y="119" font-size="13" fill="#4c1d95">Spec, plan, tasks</text>
    <text x="380" y="144" font-size="13" fill="#4c1d95">Review before building</text>
    <rect x="525" y="60" width="210" height="112" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="630" y="91" font-size="16" font-weight="700" fill="#78350f">3. Implementation</text>
    <text x="630" y="119" font-size="13" fill="#78350f">One agent or Squad</text>
    <text x="630" y="144" font-size="13" fill="#78350f">Bounded, reviewable work</text>
    <rect x="525" y="240" width="210" height="112" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="630" y="271" font-size="16" font-weight="700" fill="#1e3a8a">4. Independent checks</text>
    <text x="630" y="299" font-size="13" fill="#1e3a8a">Tests, diff, operations</text>
    <text x="630" y="324" font-size="13" fill="#1e3a8a">Evidence, not confidence</text>
    <rect x="275" y="240" width="210" height="112" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="380" y="271" font-size="16" font-weight="700" fill="#064e3b">5. Human release gate</text>
    <text x="380" y="299" font-size="13" fill="#064e3b">Approve or send back</text>
    <text x="380" y="324" font-size="13" fill="#064e3b">Roll out and observe</text>
    <text x="130" y="278" font-size="13" fill="#475569">Gaps or changed intent?</text>
    <text x="130" y="303" font-size="13" fill="#475569">Update spec and tasks.</text>
    <text x="380" y="407" font-size="13" fill="#475569">Squad handoff is optional. No agent self-report is a deployment approval.</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#sdd-arrow)">
    <path d="M235,116 H271"/>
    <path d="M485,116 H521"/>
    <path d="M630,172 V236"/>
    <path d="M525,296 H489"/>
    <path d="M275,321 H235 V202 H380 V176" stroke-dasharray="5 4"/>
  </g>
</svg>
