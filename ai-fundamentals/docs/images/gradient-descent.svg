<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Gradient descent: a curve of loss against a weight value, with steps going downhill toward the lowest point, taking smaller steps as the slope flattens">
  <defs>
    <marker id="gdArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="gdAxis" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="380" rx="16" fill="#f8fafc"/>

  <line x1="60" y1="330" x2="770" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#gdAxis)"/>
  <line x1="60" y1="330" x2="60" y2="30" stroke="#475569" stroke-width="2" marker-end="url(#gdAxis)"/>
  <text x="760" y="356" text-anchor="end" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#334155">Weight value →</text>
  <text x="74" y="40" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#334155">Loss (error) ↑</text>

  <path d="M 80 60 Q 400 520 720 60" fill="none" stroke="#2563eb" stroke-width="3"/>

  <line x1="131" y1="128" x2="200" y2="202" stroke="#dc2626" stroke-width="2" marker-end="url(#gdArrow)"/>
  <line x1="208" y1="207" x2="277" y2="256" stroke="#dc2626" stroke-width="2" marker-end="url(#gdArrow)"/>
  <line x1="285" y1="260" x2="341" y2="281" stroke="#dc2626" stroke-width="2" marker-end="url(#gdArrow)"/>
  <line x1="349" y1="284" x2="392" y2="289" stroke="#dc2626" stroke-width="2" marker-end="url(#gdArrow)"/>

  <circle cx="131" cy="128" r="7" fill="#dc2626"/>
  <circle cx="208" cy="207" r="7" fill="#dc2626"/>
  <circle cx="285" cy="260" r="7" fill="#dc2626"/>
  <circle cx="349" cy="284" r="7" fill="#dc2626"/>
  <circle cx="400" cy="290" r="9" fill="#059669"/>

  <text x="145" y="118" font-family="Inter,sans-serif" font-size="12" fill="#991b1b">Start: random weight, high loss</text>
  <text x="225" y="196" font-family="Inter,sans-serif" font-size="12" fill="#991b1b">Steep slope → big step</text>
  <text x="300" y="250" font-family="Inter,sans-serif" font-size="12" fill="#991b1b">Flatter slope → smaller step</text>
  <text x="400" y="316" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#064e3b">Minimum: lowest loss</text>

  <rect x="360" y="36" width="270" height="92" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="375" y="60" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Each step:</text>
  <text x="375" y="82" font-family="Inter,sans-serif" font-size="12" fill="#334155">new weight = old weight</text>
  <text x="375" y="100" font-family="Inter,sans-serif" font-size="12" fill="#334155">   − learning rate × slope</text>
  <text x="375" y="118" font-family="Inter,sans-serif" font-size="11" fill="#64748b">(the slope is called the gradient)</text>
</svg>
