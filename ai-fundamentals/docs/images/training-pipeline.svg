<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Inter,sans-serif" role="img" aria-label="LLM training pipeline: data collection, pretraining, base model, instruction tuning, preference tuning, safety evaluations, deployment, with monitoring feeding back into data">
  <defs>
    <marker id="tpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="340" fill="#ffffff"/>

  <text x="335" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">PRETRAINING — most of the compute</text>
  <line x1="20" y1="48" x2="650" y2="48" stroke="#93c5fd" stroke-width="2"/>
  <text x="785" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">POST-TRAINING — shapes behavior</text>
  <line x1="695" y1="48" x2="875" y2="48" stroke="#86efac" stroke-width="2"/>

  <!-- Row 1 -->
  <rect x="20" y="64" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">1 · Data collection</text>
  <text x="110" y="114" text-anchor="middle" font-size="12" fill="#1e40af">web, books, code, papers</text>

  <rect x="245" y="64" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="335" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">2 · Pretraining</text>
  <text x="335" y="114" text-anchor="middle" font-size="12" fill="#1e40af">predict the next token</text>

  <rect x="470" y="64" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="560" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">3 · Base model</text>
  <text x="560" y="114" text-anchor="middle" font-size="12" fill="#334155">a powerful autocomplete</text>

  <rect x="695" y="64" width="180" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="785" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">4 · Instruction tuning</text>
  <text x="785" y="114" text-anchor="middle" font-size="12" fill="#166534">SFT on example chats</text>

  <line x1="200" y1="99" x2="243" y2="99" stroke="#475569" stroke-width="2" marker-end="url(#tpArrow)"/>
  <line x1="425" y1="99" x2="468" y2="99" stroke="#475569" stroke-width="2" marker-end="url(#tpArrow)"/>
  <line x1="650" y1="99" x2="693" y2="99" stroke="#475569" stroke-width="2" marker-end="url(#tpArrow)"/>
  <line x1="785" y1="134" x2="785" y2="194" stroke="#475569" stroke-width="2" marker-end="url(#tpArrow)"/>

  <!-- Row 2 (right to left) -->
  <rect x="695" y="196" width="180" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="785" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">5 · Preference tuning</text>
  <text x="785" y="246" text-anchor="middle" font-size="12" fill="#166534">RLHF or DPO</text>

  <rect x="470" y="196" width="180" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">6 · Safety evals</text>
  <text x="560" y="246" text-anchor="middle" font-size="12" fill="#92400e">benchmarks, red teaming</text>

  <rect x="245" y="196" width="180" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="335" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">7 · Deployment</text>
  <text x="335" y="246" text-anchor="middle" font-size="12" fill="#5b21b6">API, chat apps, devices</text>

  <line x1="695" y1="231" x2="652" y2="231" stroke="#475569" stroke-width="2" marker-end="url(#tpArrow)"/>
  <line x1="470" y1="231" x2="427" y2="231" stroke="#475569" stroke-width="2" marker-end="url(#tpArrow)"/>

  <!-- Feedback loop -->
  <path d="M245 231 H110 V136" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tpArrow)"/>
  <text x="110" y="296" text-anchor="middle" font-size="12" fill="#5b21b6">usage feedback and new data</text>
  <text x="110" y="312" text-anchor="middle" font-size="12" fill="#5b21b6">feed the next model version</text>
</svg>
