<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="Inter,sans-serif" role="img" aria-label="Openness spectrum: closed models, open-weight models and fully open-source models, and what each releases">
  <defs>
    <marker id="os-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">The openness spectrum: what is actually released?</text>

  <rect x="30" y="56" width="270" height="330" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">Closed / proprietary</text>
  <text x="165" y="110" text-anchor="middle" font-size="13" fill="#7f1d1d">Use it through an API or app</text>

  <rect x="315" y="56" width="270" height="330" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">Open-weight</text>
  <text x="450" y="110" text-anchor="middle" font-size="13" fill="#78350f">Download the trained weights</text>

  <rect x="600" y="56" width="270" height="330" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="735" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Fully open-source</text>
  <text x="735" y="110" text-anchor="middle" font-size="13" fill="#14532d">Everything needed to rebuild it</text>

  <g font-size="14" fill="#334155">
    <text x="46" y="150">Use via API</text>
    <text x="46" y="182">Download weights</text>
    <text x="46" y="214">Inference code</text>
    <text x="46" y="246">Training code</text>
    <text x="46" y="278">Training data details</text>
    <text x="46" y="310">License</text>

    <text x="331" y="150">Use via API</text>
    <text x="331" y="182">Download weights</text>
    <text x="331" y="214">Inference code</text>
    <text x="331" y="246">Training code</text>
    <text x="331" y="278">Training data details</text>
    <text x="331" y="310">License</text>

    <text x="616" y="150">Use via API</text>
    <text x="616" y="182">Download weights</text>
    <text x="616" y="214">Inference code</text>
    <text x="616" y="246">Training code</text>
    <text x="616" y="278">Training data details</text>
    <text x="616" y="310">License</text>
  </g>

  <g font-size="14" font-weight="700" text-anchor="end">
    <text x="284" y="150" fill="#16a34a">Yes</text>
    <text x="284" y="182" fill="#dc2626">No</text>
    <text x="284" y="214" fill="#dc2626">No</text>
    <text x="284" y="246" fill="#dc2626">No</text>
    <text x="284" y="278" fill="#dc2626">No</text>
    <text x="284" y="310" fill="#7f1d1d">Terms of service</text>

    <text x="569" y="150" fill="#16a34a">Often</text>
    <text x="569" y="182" fill="#16a34a">Yes</text>
    <text x="569" y="214" fill="#16a34a">Usually</text>
    <text x="569" y="246" fill="#d97706">Rarely</text>
    <text x="569" y="278" fill="#d97706">Rarely</text>
    <text x="569" y="310" fill="#78350f">Permissive or custom</text>

    <text x="854" y="150" fill="#16a34a">Often</text>
    <text x="854" y="182" fill="#16a34a">Yes</text>
    <text x="854" y="214" fill="#16a34a">Yes</text>
    <text x="854" y="246" fill="#16a34a">Yes</text>
    <text x="854" y="278" fill="#16a34a">Yes</text>
    <text x="854" y="310" fill="#14532d">OSI-approved terms</text>
  </g>

  <line x1="46" y1="328" x2="284" y2="328" stroke="#fecaca" stroke-width="1"/>
  <line x1="331" y1="328" x2="569" y2="328" stroke="#fde68a" stroke-width="1"/>
  <line x1="616" y1="328" x2="854" y2="328" stroke="#bbf7d0" stroke-width="1"/>

  <text x="165" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">e.g. GPT, Claude, Gemini, Grok</text>
  <text x="450" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">e.g. Llama, Mistral, Qwen, DeepSeek,</text>
  <text x="450" y="370" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Gemma, Phi, Granite</text>
  <text x="735" y="352" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">e.g. OLMo (Ai2)</text>

  <line x1="60" y1="414" x2="840" y2="414" stroke="#475569" stroke-width="2.5" marker-start="url(#os-arrow)" marker-end="url(#os-arrow)"/>
  <text x="60" y="440" font-size="13" fill="#475569">Less you can inspect or change</text>
  <text x="840" y="440" text-anchor="end" font-size="13" fill="#475569">More you can inspect, rebuild and change</text>
</svg>
