<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MCP Architecture: Agent to MCP Client to MCP Server to External Service">
        <defs>
          <linearGradient id="bgGradMcp" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f5f3ff" />
            <stop offset="100%" stop-color="#ede9fe" />
          </linearGradient>
          <linearGradient id="agentGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#3b82f6" />
          </linearGradient>
          <linearGradient id="clientGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#8b5cf6" />
          </linearGradient>
          <linearGradient id="serverGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#10b981" />
          </linearGradient>
          <linearGradient id="extGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>
          <filter id="shadow3">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".15" />
          </filter>
        </defs>
        <rect x="0" y="0" width="760" height="340" rx="10" fill="url(#bgGradMcp)" />

        <!-- Title -->
        <text x="380" y="32" text-anchor="middle" fill="#4c1d95" font-size="15" font-weight="800" font-family="Inter,sans-serif">MCP Architecture — Model Context Protocol</text>

        <!-- Agent box -->
        <rect x="30" y="55" width="140" height="80" rx="12" fill="url(#agentGrad)" filter="url(#shadow3)" />
        <text x="100" y="85" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Inter,sans-serif">🤖 Host / Agent</text>
        <text x="100" y="105" text-anchor="middle" fill="#dbeafe" font-size="10" font-family="Inter,sans-serif">(Copilot cloud agent,</text>
        <text x="100" y="120" text-anchor="middle" fill="#dbeafe" font-size="10" font-family="Inter,sans-serif">CLI, VS Code)</text>

        <!-- Arrow Agent -> MCP Client -->
        <line x1="170" y1="95" x2="260" y2="95" stroke="#7c3aed" stroke-width="2.5" />
        <polygon points="256,90 266,95 256,100" fill="#7c3aed" />
        <text x="215" y="85" text-anchor="middle" fill="#7c3aed" font-size="10" font-weight="700" font-family="Inter,sans-serif">tool call</text>

        <!-- MCP Client box -->
        <rect x="270" y="55" width="140" height="80" rx="12" fill="url(#clientGrad)" filter="url(#shadow3)" />
        <text x="340" y="85" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Inter,sans-serif">🔌 MCP Client</text>
        <text x="340" y="105" text-anchor="middle" fill="#e9d5ff" font-size="10" font-family="Inter,sans-serif">(inside the host,</text>
        <text x="340" y="120" text-anchor="middle" fill="#e9d5ff" font-size="10" font-family="Inter,sans-serif">1 client per server)</text>

        <!-- Arrow MCP Client -> MCP Server -->
        <line x1="410" y1="95" x2="500" y2="95" stroke="#059669" stroke-width="2.5" />
        <polygon points="496,90 506,95 496,100" fill="#059669" />
        <text x="455" y="85" text-anchor="middle" fill="#059669" font-size="10" font-weight="700" font-family="Inter,sans-serif">JSON-RPC 2.0</text>
        <text x="455" y="108" text-anchor="middle" fill="#059669" font-size="10" font-weight="700" font-family="Inter,sans-serif">stdio / HTTP</text>

        <!-- MCP Server box -->
        <rect x="510" y="55" width="140" height="80" rx="12" fill="url(#serverGrad)" filter="url(#shadow3)" />
        <text x="580" y="85" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Inter,sans-serif">⚙️ MCP Server</text>
        <text x="580" y="105" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="Inter,sans-serif">(exposes tools,</text>
        <text x="580" y="120" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="Inter,sans-serif">resources, prompts)</text>

        <!-- Arrow MCP Server -> External Service -->
        <line x1="580" y1="135" x2="580" y2="190" stroke="#d97706" stroke-width="2.5" />
        <polygon points="575,186 580,196 585,186" fill="#d97706" />
        <text x="590" y="168" fill="#d97706" font-size="10" font-weight="700" font-family="Inter,sans-serif">API call</text>

        <!-- External Service box -->
        <rect x="510" y="200" width="140" height="80" rx="12" fill="url(#extGrad)" filter="url(#shadow3)" />
        <text x="580" y="230" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Inter,sans-serif">🌐 External Service</text>
        <text x="580" y="250" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="Inter,sans-serif">(GitHub API, Sentry,</text>
        <text x="580" y="265" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="Inter,sans-serif">Azure, DB, ...)</text>
        </svg>
