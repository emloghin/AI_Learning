<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evaluation feedback loop diagram">
        <defs>
          <linearGradient id="bgD4" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f5f3ff" />
            <stop offset="100%" stop-color="#ede9fe" />
          </linearGradient>
          <linearGradient id="defineGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#3b82f6" />
          </linearGradient>
          <linearGradient id="executeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#fbbf24" />
          </linearGradient>
          <linearGradient id="measureGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#8b5cf6" />
          </linearGradient>
          <linearGradient id="analyzeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#ef4444" />
          </linearGradient>
          <linearGradient id="tuneGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#10b981" />
          </linearGradient>
          <filter id="shadowD4">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".15" />
          </filter>
          <marker id="arrowD4" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
            <polygon points="0 0, 12 4, 0 8" fill="#7c3aed"/>
          </marker>
          <marker id="arrowD4green" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
            <polygon points="0 0, 12 4, 0 8" fill="#059669"/>
          </marker>
        </defs>
        <rect x="0" y="0" width="760" height="400" rx="10" fill="url(#bgD4)" />

        <!-- Title -->
        <text x="380" y="30" text-anchor="middle" fill="#4c1d95" font-size="15" font-weight="800" font-family="Inter,sans-serif">Plan → Act → Evaluate Feedback Loop</text>

        <!-- Center: Agent -->
        <ellipse cx="380" cy="200" rx="80" ry="40" fill="url(#defineGrad)" filter="url(#shadowD4)" />
        <text x="380" y="198" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="Inter,sans-serif">🤖 Agent</text>
        <text x="380" y="215" text-anchor="middle" fill="#dbeafe" font-size="10" font-family="Inter,sans-serif">(instructions + memory + tools)</text>

        <!-- Top: Define Success Criteria -->
        <rect x="290" y="55" width="180" height="50" rx="10" fill="url(#defineGrad)" filter="url(#shadowD4)" />
        <text x="380" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter,sans-serif">🎯 Define Success Criteria</text>
        <text x="380" y="95" text-anchor="middle" fill="#dbeafe" font-size="9" font-family="Inter,sans-serif">What does "good" look like?</text>

        <!-- Arrow: Define -> Agent -->
        <line x1="380" y1="105" x2="380" y2="155" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowD4)" />

        <!-- Right: Execute -->
        <rect x="530" y="165" width="180" height="50" rx="10" fill="url(#executeGrad)" filter="url(#shadowD4)" />
        <text x="620" y="188" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter,sans-serif">⚡ Execute Action</text>
        <text x="620" y="205" text-anchor="middle" fill="#fef3c7" font-size="9" font-family="Inter,sans-serif">Agent performs the task</text>

        <!-- Arrow: Agent -> Execute -->
        <line x1="460" y1="190" x2="525" y2="190" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowD4)" />

        <!-- Bottom: Measure -->
        <rect x="530" y="280" width="180" height="50" rx="10" fill="url(#measureGrad)" filter="url(#shadowD4)" />
        <text x="620" y="303" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter,sans-serif">📊 Measure Results</text>
        <text x="620" y="320" text-anchor="middle" fill="#e9d5ff" font-size="9" font-family="Inter,sans-serif">Checks · Scans · Tests · Reviews</text>

        <!-- Arrow: Execute -> Measure -->
        <line x1="620" y1="215" x2="620" y2="275" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowD4)" />

        <!-- Left: Analyze -->
        <rect x="50" y="280" width="180" height="50" rx="10" fill="url(#analyzeGrad)" filter="url(#shadowD4)" />
        <text x="140" y="303" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter,sans-serif">🔍 Analyze &amp; Diagnose</text>
        <text x="140" y="320" text-anchor="middle" fill="#fecaca" font-size="9" font-family="Inter,sans-serif">Reasoning · Tool misuse · Context/env</text>

        <!-- Arrow: Measure -> Analyze (bottom loop) -->
        <line x1="530" y1="305" x2="235" y2="305" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowD4)" />

        <!-- Arrow: Analyze -> Tune (up left) -->
        <line x1="140" y1="280" x2="140" y2="120" stroke="#059669" stroke-width="3" marker-end="url(#arrowD4green)" />

        <!-- Left top: Tune -->
        <rect x="50" y="70" width="180" height="50" rx="10" fill="url(#tuneGrad)" filter="url(#shadowD4)" />
        <text x="140" y="93" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter,sans-serif">🔧 Tune Agent</text>
        <text x="140" y="110" text-anchor="middle" fill="#d1fae5" font-size="9" font-family="Inter,sans-serif">Instructions · Memory · Tools/MCP</text>

        <!-- Arrow: Tune -> Agent -->
        <line x1="230" y1="95" x2="295" y2="160" stroke="#059669" stroke-width="3" marker-end="url(#arrowD4green)" />

        <!-- Labels for loop direction -->
        <text x="380" y="270" text-anchor="middle" fill="#7c3aed" font-size="10" font-weight="700" font-family="Inter,sans-serif">Output (PR, logs) flows to measurement</text>
        <text x="380" y="340" text-anchor="middle" fill="#7c3aed" font-size="10" font-weight="700" font-family="Inter,sans-serif">← Results feed analysis →</text>

        <!-- Small check/diagnosis markers -->
        <text x="380" y="370" text-anchor="middle" fill="#64748b" font-size="10" font-family="Inter,sans-serif">The loop repeats — each iteration improves agent quality</text>
      </svg>
