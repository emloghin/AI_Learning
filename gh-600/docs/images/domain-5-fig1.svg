<svg viewBox="0 0 800 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Multi-agent pipeline diagram showing parallel and sequential orchestration">
        <defs>
          <linearGradient id="bgD5" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f0fdf4" />
            <stop offset="100%" stop-color="#dcfce7" />
          </linearGradient>
          <linearGradient id="planGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#3b82f6" />
          </linearGradient>
          <linearGradient id="devGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#fbbf24" />
          </linearGradient>
          <linearGradient id="reviewGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#8b5cf6" />
          </linearGradient>
          <linearGradient id="testGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#10b981" />
          </linearGradient>
          <linearGradient id="deployGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#ef4444" />
          </linearGradient>
          <filter id="shadowD5">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".15" />
          </filter>
          <marker id="arrowD5" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
            <polygon points="0 0, 12 4, 0 8" fill="#475569"/>
          </marker>
          <marker id="arrowD5green" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
            <polygon points="0 0, 12 4, 0 8" fill="#059669"/>
          </marker>
        </defs>
        <rect x="0" y="0" width="800" height="680" rx="10" fill="url(#bgD5)" />

        <!-- Title -->
        <text x="400" y="30" text-anchor="middle" fill="#065f46" font-size="16" font-weight="800" font-family="Inter,sans-serif">Multi-Agent Pipeline: Parallel + Sequential Orchestration</text>

        <!-- Phase labels on left -->
        <text x="20" y="89" text-anchor="start" fill="#475569" font-size="11" font-weight="700" font-family="Inter,sans-serif">PHASE 1</text>
        <text x="20" y="145" text-anchor="start" fill="#475569" font-size="11" font-weight="700" font-family="Inter,sans-serif">PHASE 2</text>
        <text x="20" y="158" text-anchor="start" fill="#475569" font-size="10" font-family="Inter,sans-serif">(Parallel)</text>
        <text x="20" y="324" text-anchor="start" fill="#475569" font-size="11" font-weight="700" font-family="Inter,sans-serif">PHASE 3</text>
        <text x="20" y="414" text-anchor="start" fill="#475569" font-size="11" font-weight="700" font-family="Inter,sans-serif">PHASE 4</text>
        <text x="20" y="524" text-anchor="start" fill="#475569" font-size="11" font-weight="700" font-family="Inter,sans-serif">PHASE 5</text>

        <!-- Phase 1: Plan Agent (Single, Sequential start) -->
        <rect x="260" y="60" width="280" height="50" rx="10" fill="url(#planGrad)" filter="url(#shadowD5)" />
        <text x="400" y="83" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Inter,sans-serif">📋 Plan Agent</text>
        <text x="400" y="100" text-anchor="middle" fill="#dbeafe" font-size="10" font-family="Inter,sans-serif">Analyze requirements · Create issues · Define scope</text>

        <!-- Arrow down from Plan -->
        <line x1="400" y1="110" x2="400" y2="145" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowD5)" />
        <text x="420" y="135" text-anchor="start" fill="#059669" font-size="9" font-weight="600" font-family="Inter,sans-serif">needs: [plan]</text>

        <!-- Phase 2: Parallel Dev Agents (Matrix) -->
        <!-- Branch vertical line -->
        <line x1="400" y1="145" x2="400" y2="155" stroke="#475569" stroke-width="2" />
        <line x1="140" y1="155" x2="660" y2="155" stroke="#475569" stroke-width="2" />
        <line x1="140" y1="155" x2="140" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrowD5)" />
        <line x1="400" y1="155" x2="400" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrowD5)" />
        <line x1="660" y1="155" x2="660" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrowD5)" />

        <!-- Dev Agent A -->
        <rect x="60" y="170" width="160" height="50" rx="10" fill="url(#devGrad)" filter="url(#shadowD5)" />
        <text x="140" y="193" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter,sans-serif">🖥️ Dev Agent A</text>
        <text x="140" y="210" text-anchor="middle" fill="#fef3c7" font-size="9" font-family="Inter,sans-serif">Frontend module</text>

        <!-- Dev Agent B -->
        <rect x="320" y="170" width="160" height="50" rx="10" fill="url(#devGrad)" filter="url(#shadowD5)" />
        <text x="400" y="193" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter,sans-serif">🖥️ Dev Agent B</text>
        <text x="400" y="210" text-anchor="middle" fill="#fef3c7" font-size="9" font-family="Inter,sans-serif">Backend / API</text>

        <!-- Dev Agent C -->
        <rect x="580" y="170" width="160" height="50" rx="10" fill="url(#devGrad)" filter="url(#shadowD5)" />
        <text x="660" y="193" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter,sans-serif">🖥️ Dev Agent C</text>
        <text x="660" y="210" text-anchor="middle" fill="#fef3c7" font-size="9" font-family="Inter,sans-serif">Tests</text>

        <!-- "strategy.matrix" label -->
        <text x="400" y="240" text-anchor="middle" fill="#059669" font-size="10" font-weight="700" font-family="Inter,sans-serif">strategy.matrix: 3 parallel legs, each on its own branch</text>

        <!-- Join lines from parallel agents -->
        <line x1="140" y1="220" x2="140" y2="260" stroke="#475569" stroke-width="1.5" />
        <line x1="400" y1="220" x2="400" y2="260" stroke="#475569" stroke-width="1.5" />
        <line x1="660" y1="220" x2="660" y2="260" stroke="#475569" stroke-width="1.5" />
        <line x1="140" y1="260" x2="660" y2="260" stroke="#475569" stroke-width="2" />
        <line x1="400" y1="260" x2="400" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrowD5)" />
        <text x="420" y="283" text-anchor="start" fill="#059669" font-size="9" font-weight="600" font-family="Inter,sans-serif">needs: [dev]  (waits for all matrix legs)</text>

        <!-- Phase 3: Sequential Review -> Test -->
        <!-- Review Agent -->
        <rect x="260" y="295" width="280" height="50" rx="10" fill="url(#reviewGrad)" filter="url(#shadowD5)" />
        <text x="400" y="318" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Inter,sans-serif">🔍 Review Agent</text>
        <text x="400" y="335" text-anchor="middle" fill="#e9d5ff" font-size="10" font-family="Inter,sans-serif">Inspect diffs · Lint · Flag issues</text>

        <!-- Arrow: Review -> Test -->
        <line x1="400" y1="345" x2="400" y2="380" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowD5)" />
        <text x="420" y="372" text-anchor="start" fill="#059669" font-size="9" font-weight="600" font-family="Inter,sans-serif">needs: [review]</text>

        <!-- Phase 4: Test Agent -->
        <rect x="260" y="385" width="280" height="50" rx="10" fill="url(#testGrad)" filter="url(#shadowD5)" />
        <text x="400" y="408" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Inter,sans-serif">🧪 Test Agent</text>
        <text x="400" y="425" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="Inter,sans-serif">Run unit + integration + E2E tests</text>

        <!-- Arrow: Test -> Deploy -->
        <line x1="400" y1="435" x2="400" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowD5)" />
        <text x="420" y="478" text-anchor="start" fill="#059669" font-size="9" font-weight="600" font-family="Inter,sans-serif">needs: [test]</text>

        <!-- Phase 5: Deploy Agent -->
        <rect x="260" y="495" width="280" height="50" rx="10" fill="url(#deployGrad)" filter="url(#shadowD5)" />
        <text x="400" y="518" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Inter,sans-serif">🚀 Deploy Agent</text>
        <text x="400" y="535" text-anchor="middle" fill="#fecaca" font-size="10" font-family="Inter,sans-serif">environment: production · required human reviewer</text>

        <!-- Legend -->
        <rect x="50" y="570" width="700" height="85" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1" />
        <text x="400" y="590" text-anchor="middle" fill="#475569" font-size="11" font-weight="700" font-family="Inter,sans-serif">Legend</text>

        <rect x="70" y="600" width="12" height="12" rx="3" fill="url(#planGrad)" />
        <text x="88" y="610" fill="#475569" font-size="10" font-family="Inter,sans-serif">Sequential (needs)</text>

        <rect x="220" y="600" width="12" height="12" rx="3" fill="url(#devGrad)" />
        <text x="238" y="610" fill="#475569" font-size="10" font-family="Inter,sans-serif">Parallel (strategy.matrix)</text>

        <rect x="410" y="600" width="12" height="12" rx="3" fill="url(#reviewGrad)" />
        <text x="428" y="610" fill="#475569" font-size="10" font-family="Inter,sans-serif">Sequential Review Gate</text>

        <rect x="590" y="600" width="12" height="12" rx="3" fill="url(#deployGrad)" />
        <text x="608" y="610" fill="#475569" font-size="10" font-family="Inter,sans-serif">Deploy (needs)</text>

        <text x="400" y="640" text-anchor="middle" fill="#059669" font-size="9" font-weight="600" font-family="Inter,sans-serif">Phase 1 → Phase 2 (parallel) → Phase 3 → Phase 4 → Phase 5 (sequential)</text>
      </svg>
