<svg viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg" style="max-width:840px">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
          </marker>
          <marker id="arrow-done" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
          </marker>
        </defs>

        <!-- Row 1: Issue -> Branch -> Agent -> PR -->
        <rect x="10" y="20" width="100" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
        <text x="60" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Issue</text>

        <line x1="110" y1="45" x2="150" y2="45" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="155" y="20" width="100" height="50" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
        <text x="205" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">Branch</text>

        <line x1="255" y1="45" x2="295" y2="45" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="300" y="20" width="100" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
        <text x="350" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Agent</text>

        <line x1="400" y1="45" x2="440" y2="45" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="445" y="20" width="100" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
        <text x="495" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">PR</text>

        <!-- Arrow down from PR to row 2 -->
        <line x1="495" y1="70" x2="495" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

        <!-- Row 2: Checks -> Review -> Merge -->
        <rect x="420" y="105" width="110" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
        <text x="475" y="131" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Status Checks</text>

        <line x1="530" y1="130" x2="570" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="575" y="105" width="110" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
        <text x="630" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Review</text>

        <line x1="685" y1="130" x2="725" y2="130" stroke="#059669" stroke-width="2" marker-end="url(#arrow-done)"/>

        <rect x="730" y="105" width="100" height="50" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
        <text x="780" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Merge</text>

        <!-- Governance annotations below each step -->
        <text x="60" y="90" text-anchor="middle" font-size="10" fill="#64748b">Issue templates</text>
        <text x="350" y="90" text-anchor="middle" font-size="10" fill="#64748b">Plan-review gate</text>
        <text x="475" y="168" text-anchor="middle" font-size="10" fill="#64748b">Required checks (Actions, CodeQL)</text>
        <text x="630" y="168" text-anchor="middle" font-size="10" fill="#64748b">CODEOWNERS approval</text>
        <text x="780" y="168" text-anchor="middle" font-size="10" fill="#64748b">Rulesets / branch protection</text>
      </svg>
