<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter,sans-serif" role="img" aria-label="The generation loop: the context goes into the model, the model outputs probabilities, one token is picked, appended to the context, and the loop repeats">
  <defs>
    <marker id="glArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="320" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-size="13" fill="#475569">Repeats once per token, and stops at an end-of-text token or the output length limit</text>

  <!-- 1 Context -->
  <rect x="20" y="100" width="190" height="80" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="115" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">1 · Context so far</text>
  <text x="115" y="150" text-anchor="middle" font-size="13" fill="#334155">"The cat sat on the"</text>
  <text x="115" y="168" text-anchor="middle" font-size="11" fill="#64748b">prompt + tokens written so far</text>

  <!-- 2 Model -->
  <rect x="260" y="100" width="150" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="335" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">2 · Model</text>
  <text x="335" y="152" text-anchor="middle" font-size="12" fill="#1e40af">one forward pass</text>
  <text x="335" y="168" text-anchor="middle" font-size="11" fill="#1e40af">through all layers</text>

  <!-- 3 Probabilities -->
  <rect x="460" y="86" width="150" height="108" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="535" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">3 · Probabilities</text>
  <text x="480" y="132" font-size="12" fill="#3b0764">mat</text><text x="590" y="132" text-anchor="end" font-size="12" fill="#3b0764">40%</text>
  <text x="480" y="150" font-size="12" fill="#3b0764">floor</text><text x="590" y="150" text-anchor="end" font-size="12" fill="#3b0764">20%</text>
  <text x="480" y="168" font-size="12" fill="#3b0764">sofa</text><text x="590" y="168" text-anchor="end" font-size="12" fill="#3b0764">15%</text>
  <text x="480" y="186" font-size="12" fill="#3b0764">…</text><text x="590" y="186" text-anchor="end" font-size="12" fill="#3b0764">25%</text>

  <!-- 4 Pick -->
  <rect x="660" y="100" width="120" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">4 · Pick one</text>
  <text x="720" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">"mat"</text>
  <text x="720" y="168" text-anchor="middle" font-size="11" fill="#15803d">via sampling</text>

  <line x1="210" y1="140" x2="258" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#glArrow)"/>
  <line x1="410" y1="140" x2="458" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#glArrow)"/>
  <line x1="610" y1="140" x2="658" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#glArrow)"/>

  <!-- Loop back -->
  <path d="M720 180 V256 H115 V182" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#glArrow)"/>
  <text x="418" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">5 · Append "mat" → "The cat sat on the mat" → go again</text>
</svg>
