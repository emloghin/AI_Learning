<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-label="An artificial neuron: three inputs are multiplied by weights, summed with a bias, passed through an activation function, and produce one output">
  <defs>
    <marker id="nrArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="340" rx="16" fill="#f8fafc"/>

  <circle cx="90" cy="80" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">x₁=2</text>
  <circle cx="90" cy="170" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="176" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">x₂=1</text>
  <circle cx="90" cy="260" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="266" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">x₃=3</text>
  <text x="90" y="320" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#334155">Inputs</text>

  <line x1="120" y1="85" x2="330" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#nrArrow)"/>
  <line x1="120" y1="170" x2="326" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#nrArrow)"/>
  <line x1="120" y1="255" x2="330" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#nrArrow)"/>
  <text x="200" y="100" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#7c3aed">w₁ = 0.5</text>
  <text x="200" y="162" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#7c3aed">w₂ = -1</text>
  <text x="200" y="250" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#7c3aed">w₃ = 0.25</text>

  <circle cx="380" cy="170" r="50" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="380" y="166" text-anchor="middle" font-family="Inter,sans-serif" font-size="22" font-weight="700" fill="#78350f">Σ</text>
  <text x="380" y="190" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#78350f">+ bias 0.5</text>
  <text x="380" y="250" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#334155">Weighted sum</text>
  <text x="380" y="270" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#475569">z = 1 - 1 + 0.75 + 0.5 = 1.25</text>

  <line x1="430" y1="170" x2="506" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#nrArrow)"/>

  <rect x="510" y="130" width="120" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="570" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="700" fill="#4c1d95">Activation</text>
  <text x="570" y="188" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#4c1d95">ReLU(z)</text>
  <text x="570" y="250" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#334155">Squash or clip</text>

  <line x1="630" y1="170" x2="696" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#nrArrow)"/>

  <circle cx="740" cy="170" r="40" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="740" y="176" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#064e3b">1.25</text>
  <text x="740" y="250" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#334155">Output</text>
</svg>
